<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#07111f">

<title>Dashboard | LINK4 COMMUNICATION</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #07111f 0%,
        #0b2d25 50%,
        #07111f 100%
    );

    color:white;

    padding:25px;

}


/* =================================
   MAIN CONTAINER
================================= */

.container{

    width:100%;

    max-width:1000px;

    margin:auto;

}


/* =================================
   HEADER
================================= */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;

}


.logo{

    font-size:22px;

    font-weight:bold;

    color:#00e676;

}


.logout-btn{

    border:none;

    padding:
    10px 18px;

    border-radius:9px;

    background:
    rgba(255,80,80,0.12);

    border:
    1px solid
    rgba(255,80,80,0.2);

    color:#ff6b6b;

    cursor:pointer;

    font-weight:bold;

}


.logout-btn:hover{

    background:
    rgba(255,80,80,0.2);

}


/* =================================
   HELLO CARD
================================= */

.welcome-card{

    background:
    rgba(255,255,255,0.07);

    border:
    1px solid
    rgba(255,255,255,0.12);

    border-radius:22px;

    padding:40px;

    margin-bottom:25px;

    backdrop-filter:
    blur(15px);

    box-shadow:
    0 20px 50px
    rgba(0,0,0,0.25);

}


.hello{

    color:#00e676;

    font-size:15px;

    font-weight:bold;

    margin-bottom:10px;

    letter-spacing:1px;

}


h1{

    font-size:38px;

    margin-bottom:12px;

}


.description{

    color:#9daab6;

    font-size:15px;

}


/* =================================
   ACCOUNT SECTION
================================= */

.account-card{

    background:
    rgba(255,255,255,0.06);

    border:
    1px solid
    rgba(255,255,255,0.1);

    border-radius:22px;

    padding:30px;

}


.section-title{

    font-size:22px;

    margin-bottom:22px;

}


/* =================================
   ACCOUNT GRID
================================= */

.account-grid{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

}


.info-card{

    padding:20px;

    border-radius:14px;

    background:
    rgba(255,255,255,0.05);

    border:
    1px solid
    rgba(255,255,255,0.07);

}


.label{

    color:#84919d;

    font-size:12px;

    margin-bottom:9px;

    text-transform:
    uppercase;

}


.value{

    font-size:16px;

    font-weight:bold;

    word-break:
    break-word;

}


/* =================================
   ACCOUNT BUTTON
================================= */

.account-btn{

    display:inline-block;

    margin-top:25px;

    padding:
    13px 22px;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #00c853,
        #00e676
    );

    color:white;

    text-decoration:none;

    font-size:14px;

    font-weight:bold;

    transition:0.3s;

}


.account-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 10px 25px
    rgba(0,200,83,0.3);

}


/* =================================
   MOBILE
================================= */

@media(max-width:800px){

    .account-grid{

        grid-template-columns:
        repeat(2,1fr);

    }

}


@media(max-width:500px){

    body{

        padding:15px;

    }


    .header{

        margin-bottom:20px;

    }


    h1{

        font-size:30px;

    }


    .welcome-card{

        padding:28px 22px;

    }


    .account-card{

        padding:22px;

    }


    .account-grid{

        grid-template-columns:
        1fr;

    }

}

</style>

</head>



<body>



<div class="container">


    <!-- HEADER -->

    <div class="header">


        <div class="logo">

            LINK4 COMMUNICATION

        </div>



        <button

            class="logout-btn"

            onclick="logout()"

        >

            Logout

        </button>


    </div>



    <!-- HELLO WORLD -->

    <div class="welcome-card">


        <div class="hello">

            HELLO WORLD

        </div>


        <h1>

            Hello,

            <span id="userName">

                User

            </span>

            👋

        </h1>


        <div class="description">

            Welcome to your LINK4 COMMUNICATION Dashboard.

        </div>


    </div>



    <!-- ACCOUNT INFORMATION -->

    <div class="account-card">


        <div class="section-title">

            Account Information

        </div>



        <div class="account-grid">


            <!-- NAME -->

            <div class="info-card">


                <div class="label">

                    Name

                </div>


                <div

                    class="value"

                    id="name"

                >

                    -

                </div>


            </div>



            <!-- USERNAME -->

            <div class="info-card">


                <div class="label">

                    Username

                </div>


                <div

                    class="value"

                    id="username"

                >

                    -

                </div>


            </div>



            <!-- ROLE -->

            <div class="info-card">


                <div class="label">

                    Role

                </div>


                <div

                    class="value"

                    id="role"

                >

                    -

                </div>


            </div>



            <!-- STATUS -->

            <div class="info-card">


                <div class="label">

                    Status

                </div>


                <div

                    class="value"

                    id="status"

                >

                    -

                </div>


            </div>


        </div>



        <!-- MY ACCOUNT -->

        <a

            href="account.html"

            class="account-btn"

        >

            My Account →

        </a>


    </div>


</div>



<script>


/* =================================
   LOGIN SECURITY
================================= */

const loggedIn =

localStorage.getItem(
    "loggedIn"
);


if(

    loggedIn !==
    "true"

){

    window.location.href =
    "login.html";

}



/* =================================
   GET USER DATA
================================= */

const name =

localStorage.getItem(
    "name"
) || "User";


const username =

localStorage.getItem(
    "username"
) || "-";


const role =

localStorage.getItem(
    "role"
) || "-";


const status =

localStorage.getItem(
    "status"
) || "-";



/* =================================
   SHOW DATA
================================= */

document
.getElementById(
    "userName"
)
.innerText =
name;


document
.getElementById(
    "name"
)
.innerText =
name;


document
.getElementById(
    "username"
)
.innerText =
username;


document
.getElementById(
    "role"
)
.innerText =
role;


document
.getElementById(
    "status"
)
.innerText =
status;



/* =================================
   LOGOUT
================================= */

function logout(){


    localStorage.clear();


    window.location.href =
    "login.html";


}

</script>



</body>

</html>
