```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#07111f">

<title>Login | LINK4 COMMUNICATION</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #07111f 0%,
        #0b2d25 50%,
        #07111f 100%
    );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:white;

}


/* Login Card */

.login-card{

    width:100%;

    max-width:420px;

    padding:40px 32px;

    background:
    rgba(255,255,255,0.07);

    border:
    1px solid
    rgba(255,255,255,0.12);

    border-radius:22px;

    backdrop-filter:
    blur(20px);

    box-shadow:
    0 25px 70px
    rgba(0,0,0,0.45);

}


/* Logo */

.logo{

    width:75px;

    height:75px;

    margin:
    0 auto 20px;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        #00c853,
        #00e676
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:26px;

    font-weight:bold;

    box-shadow:
    0 12px 30px
    rgba(0,200,83,0.3);

}


/* Title */

h1{

    text-align:center;

    font-size:28px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#9daab6;

    font-size:14px;

    margin-bottom:32px;

}


/* Input Group */

.input-group{

    margin-bottom:20px;

}


label{

    display:block;

    margin-bottom:8px;

    color:#dce5ed;

    font-size:14px;

    font-weight:500;

}


input{

    width:100%;

    padding:15px 16px;

    border-radius:11px;

    border:
    1px solid
    rgba(255,255,255,0.12);

    background:
    rgba(255,255,255,0.08);

    color:white;

    font-size:15px;

    outline:none;

    transition:
    0.3s;

}


input::placeholder{

    color:#7e8b97;

}


input:focus{

    border-color:
    #00e676;

    box-shadow:
    0 0 0 3px
    rgba(0,230,118,0.1);

}


/* Login Button */

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:11px;

    background:
    linear-gradient(
        135deg,
        #00c853,
        #00e676
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:
    0.3s;

    margin-top:5px;

}


.login-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 12px 30px
    rgba(0,200,83,0.3);

}


.login-btn:active{

    transform:
    translateY(0);

}


.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

}


/* Message */

.message{

    min-height:22px;

    text-align:center;

    margin-top:18px;

    font-size:14px;

}


.error{

    color:#ff6b6b;

}


.success{

    color:#00e676;

}


/* Back Button */

.back{

    display:block;

    text-align:center;

    margin-top:22px;

    color:#8e9aa5;

    font-size:13px;

    text-decoration:none;

}


.back:hover{

    color:#00e676;

}


/* Footer */

.footer{

    text-align:center;

    margin-top:25px;

    color:#667583;

    font-size:11px;

}


/* Mobile */

@media(max-width:500px){

    .login-card{

        padding:
        32px 22px;

    }

}

</style>

</head>



<body>



<div class="login-card">


    <!-- Logo -->

    <div class="logo">

        L4

    </div>



    <!-- Title -->

    <h1>

        Welcome Back

    </h1>


    <div class="subtitle">

        Sign in to LINK4 COMMUNICATION

    </div>



    <!-- Login Form -->

    <form id="loginForm">


        <!-- Username -->

        <div class="input-group">

            <label>

                Username

            </label>

            <input

                type="text"

                id="username"

                placeholder="Enter username"

                autocomplete="username"

                required

            >

        </div>



        <!-- Password -->

        <div class="input-group">

            <label>

                Password

            </label>

            <input

                type="password"

                id="password"

                placeholder="Enter password"

                autocomplete="current-password"

                required

            >

        </div>



        <!-- Button -->

        <button

            type="submit"

            class="login-btn"

            id="loginBtn"

        >

            Login

        </button>


    </form>



    <!-- Message -->

    <div

        id="message"

        class="message"

    ></div>



    <!-- Back -->

    <a

        href="index.html"

        class="back"

    >

        ← Back to Home

    </a>



    <!-- Footer -->

    <div class="footer">

        © 2026 LINK4 COMMUNICATION

    </div>


</div>



<script>


/* =========================================
   TEST LOGIN
   TEMPORARY USERNAME & PASSWORD
========================================= */

const TEST_USERNAME = "admin";

const TEST_PASSWORD = "12345";



document
.getElementById("loginForm")
.addEventListener(
"submit",
function(event){


    event.preventDefault();



    const username =
    document
    .getElementById("username")
    .value
    .trim();



    const password =
    document
    .getElementById("password")
    .value
    .trim();



    const button =
    document
    .getElementById("loginBtn");



    const message =
    document
    .getElementById("message");



    /* Loading */

    button.disabled = true;

    button.innerText =
    "Checking...";



    message.className =
    "message";

    message.innerText =
    "Please wait...";



    /* Test Login */

    setTimeout(function(){


        if(

            username ===
            TEST_USERNAME

            &&

            password ===
            TEST_PASSWORD

        ){


            /* Save Login */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "username",
                username
            );


            localStorage.setItem(
                "name",
                "Administrator"
            );


            localStorage.setItem(
                "role",
                "Admin"
            );


            localStorage.setItem(
                "status",
                "Active"
            );



            message.className =
            "message success";


            message.innerText =
            "Login successful!";



            /* Dashboard */

            setTimeout(function(){


                window.location.href =
                "dashboard.html";


            },800);



        }


        else{


            message.className =
            "message error";


            message.innerText =
            "Invalid username or password.";


            button.disabled =
            false;


            button.innerText =
            "Login";


        }


    },800);


});


</script>


</body>

</html>
```
