
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#07111f">

<title>Login | LINK4 COMMUNICATION</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #07111f 0%,
        #0b2d25 50%,
        #07111f 100%
    );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:white;

}


/* =================================
   LOGIN CARD
================================= */

.login-card{

    width:100%;

    max-width:420px;

    padding:42px 32px;

    background:
    rgba(255,255,255,0.07);

    border:
    1px solid
    rgba(255,255,255,0.12);

    border-radius:22px;

    backdrop-filter:
    blur(20px);

    box-shadow:
    0 25px 70px
    rgba(0,0,0,0.45);

}


/* =================================
   LOGO
================================= */

.logo{

    width:78px;

    height:78px;

    margin:
    0 auto 20px;

    border-radius:21px;

    background:
    linear-gradient(
        135deg,
        #00c853,
        #00e676
    );

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    font-weight:bold;

    box-shadow:
    0 12px 30px
    rgba(0,200,83,0.3);

}


/* =================================
   TITLE
================================= */

h1{

    text-align:center;

    font-size:28px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#9daab6;

    font-size:14px;

    margin-bottom:32px;

}


/* =================================
   INPUT
================================= */

.input-group{

    margin-bottom:20px;

}


label{

    display:block;

    margin-bottom:8px;

    color:#dce5ed;

    font-size:14px;

    font-weight:500;

}


input{

    width:100%;

    padding:15px 16px;

    border-radius:11px;

    border:
    1px solid
    rgba(255,255,255,0.12);

    background:
    rgba(255,255,255,0.08);

    color:white;

    font-size:15px;

    outline:none;

    transition:
    0.3s;

}


input::placeholder{

    color:#7e8b97;

}


input:focus{

    border-color:
    #00e676;

    box-shadow:
    0 0 0 3px
    rgba(0,230,118,0.1);

}


/* =================================
   LOGIN BUTTON
================================= */

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:11px;

    background:
    linear-gradient(
        135deg,
        #00c853,
        #00e676
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:
    0.3s;

    margin-top:5px;

}


.login-btn:hover{

    transform:
    translateY(-2px);

    box-shadow:
    0 12px 30px
    rgba(0,200,83,0.3);

}


.login-btn:disabled{

    opacity:0.6;

    cursor:not-allowed;

}


/* =================================
   MESSAGE
================================= */

.message{

    min-height:22px;

    text-align:center;

    margin-top:18px;

    font-size:14px;

}


.error{

    color:#ff6b6b;

}


.success{

    color:#00e676;

}


.loading{

    color:#ffc107;

}


/* =================================
   BACK
================================= */

.back{

    display:block;

    text-align:center;

    margin-top:22px;

    color:#8e9aa5;

    font-size:13px;

    text-decoration:none;

}


.back:hover{

    color:#00e676;

}


/* =================================
   FOOTER
================================= */

.footer{

    text-align:center;

    margin-top:25px;

    color:#667583;

    font-size:11px;

}


/* =================================
   MOBILE
================================= */

@media(max-width:500px){

    .login-card{

        padding:
        32px 22px;

    }

}

</style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <div class="logo">

        L4

    </div>



    <!-- TITLE -->

    <h1>

        Welcome Back

    </h1>


    <div class="subtitle">

        Sign in to LINK4 COMMUNICATION

    </div>



    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="input-group">

            <label>

                Username

            </label>

            <input

                type="text"

                id="username"

                placeholder="Enter username"

                autocomplete="username"

                required

            >

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <label>

                Password

            </label>

            <input

                type="password"

                id="password"

                placeholder="Enter password"

                autocomplete="current-password"

                required

            >

        </div>



        <!-- LOGIN -->

        <button

            type="submit"

            class="login-btn"

            id="loginBtn"

        >

            Login

        </button>


    </form>



    <!-- MESSAGE -->

    <div

        id="message"

        class="message"

    ></div>



    <!-- BACK -->

    <a

        href="index.html"

        class="back"

    >

        ← Back to Home

    </a>



    <!-- FOOTER -->

    <div class="footer">

        © 2026 LINK4 COMMUNICATION

    </div>


</div>



<script>


/* =========================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxfUUdFpRqIckbcxPuJRqUICnbjJQXhVW63P9TegivLB8ORSTFEMBkdIG8w7K2KvpBZow/exec";



/* =========================================
   LOGIN FORM
========================================= */

document
.getElementById("loginForm")
.addEventListener(
"submit",
function(event){

    event.preventDefault();


    /* GET INPUT */

    const username =
    document
    .getElementById("username")
    .value
    .trim();


    const password =
    document
    .getElementById("password")
    .value
    .trim();


    const loginBtn =
    document
    .getElementById("loginBtn");


    const message =
    document
    .getElementById("message");



    /* VALIDATION */

    if(
        !username ||
        !password
    ){

        message.className =
        "message error";

        message.innerText =
        "Please enter username and password.";

        return;

    }



    /* LOADING */

    loginBtn.disabled =
    true;

    loginBtn.innerText =
    "Checking...";


    message.className =
    "message loading";

    message.innerText =
    "Verifying your account...";



    /* =====================================
       SEND LOGIN REQUEST
    ===================================== */

    const url =

    API_URL +

    "?action=login" +

    "&username=" +

    encodeURIComponent(username) +

    "&password=" +

    encodeURIComponent(password);



    fetch(url)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }

        return response.json();

    })


    .then(function(data){


        /* =================================
           LOGIN SUCCESS
        ================================= */

        if(
            data.success === true
        ){


            /* SAVE LOGIN STATUS */

            localStorage.setItem(
                "loggedIn",
                "true"
            );


            /* SAVE USERNAME */

            localStorage.setItem(
                "username",
                data.username ||
                username
            );


            /* SAVE NAME */

            localStorage.setItem(
                "name",
                data.name ||
                ""
            );


            /* SAVE ROLE */

            localStorage.setItem(
                "role",
                data.role ||
                ""
            );


            /* SAVE STATUS */

            localStorage.setItem(
                "status",
                data.status ||
                ""
            );



            /* SUCCESS MESSAGE */

            message.className =
            "message success";

            message.innerText =
            "Login successful! Redirecting...";



            /* REDIRECT */

            setTimeout(function(){

                window.location.href =
                "dashboard.html";

            },1000);


        }


        /* =================================
           LOGIN FAILED
        ================================= */

        else{


            message.className =
            "message error";


            message.innerText =

            data.message ||

            "Invalid username or password.";


            loginBtn.disabled =
            false;


            loginBtn.innerText =
            "Login";


        }

    })


    /* =====================================
       CONNECTION ERROR
    ===================================== */

    .catch(function(error){


        console.error(
            "Login Error:",
            error
        );


        message.className =
        "message error";


        message.innerText =

        "Unable to connect to server. Please try again.";


        loginBtn.disabled =
        false;


        loginBtn.innerText =
        "Login";


    });


});

</script>


</body>

</html>
