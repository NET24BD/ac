<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#0b1220"
>

<title>
My Account | LINK4 COMMUNICATION
</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;

    background:#f5f7fb;

    color:#172033;

    min-height:100vh;

}


/* =====================================================
   TOP NAVBAR
===================================================== */

.topbar{

    width:100%;

    height:72px;

    background:#ffffff;

    border-bottom:
    1px solid #e7ebf2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
    0 35px;

    position:sticky;

    top:0;

    z-index:100;

}


.brand{

    display:flex;

    align-items:center;

    gap:12px;

}


.brand-logo{

    width:42px;

    height:42px;

    border-radius:12px;

    background:
    linear-gradient(
        135deg,
        #0f766e,
        #16a34a
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    font-weight:800;

}


.brand-text{

    font-size:18px;

    font-weight:800;

    color:#111827;

    letter-spacing:.3px;

}


.back-btn{

    text-decoration:none;

    color:#334155;

    background:#f1f5f9;

    padding:
    10px 17px;

    border-radius:10px;

    font-size:14px;

    font-weight:600;

    transition:.2s;

}


.back-btn:hover{

    background:#e2e8f0;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:
    min(
        1180px,
        calc(100% - 32px)
    );

    margin:
    35px auto 60px;

}


/* =====================================================
   PROFILE HERO
===================================================== */

.profile-hero{

    background:#ffffff;

    border:
    1px solid #e7ebf2;

    border-radius:22px;

    padding:30px;

    display:flex;

    align-items:center;

    gap:25px;

    box-shadow:
    0 10px 35px
    rgba(
        15,
        23,
        42,
        .06
    );

    margin-bottom:25px;

}


.profile-picture{

    width:110px;

    height:110px;

    border-radius:50%;

    object-fit:cover;

    border:
    5px solid #ffffff;

    box-shadow:
    0 0 0 2px #16a34a,
    0 10px 25px
    rgba(
        15,
        23,
        42,
        .15
    );

    background:#f1f5f9;

}


.profile-info{

    flex:1;

}


.profile-name{

    font-size:28px;

    font-weight:800;

    color:#111827;

    margin-bottom:7px;

}


.profile-username{

    font-size:14px;

    color:#64748b;

    margin-bottom:14px;

}


.profile-badges{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.badge{

    display:inline-flex;

    align-items:center;

    padding:
    7px 12px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;

}


.role-badge{

    background:#ecfdf5;

    color:#047857;

}


.status-badge{

    background:#eff6ff;

    color:#2563eb;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:
    30px 0 15px;

}


.section-title h2{

    font-size:21px;

    color:#111827;

}


.section-title span{

    font-size:12px;

    color:#94a3b8;

}


/* =====================================================
   PERSONAL INFORMATION
===================================================== */

.info-card{

    background:#ffffff;

    border:
    1px solid #e7ebf2;

    border-radius:18px;

    padding:25px;

    box-shadow:
    0 8px 30px
    rgba(
        15,
        23,
        42,
        .04
    );

}


.info-grid{

    display:grid;

    grid-template-columns:
    repeat(
        2,
        minmax(
            0,
            1fr
        )
    );

    gap:15px;

}


.info-item{

    background:#f8fafc;

    border:
    1px solid #eef2f7;

    padding:16px;

    border-radius:13px;

}


.info-label{

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.7px;

    color:#94a3b8;

    font-weight:700;

    margin-bottom:6px;

}


.info-value{

    font-size:15px;

    font-weight:600;

    color:#1e293b;

    word-break:break-word;

}


.empty-value{

    color:#cbd5e1;

    font-weight:500;

}


/* =====================================================
   COLLABORATION SECTION
===================================================== */

#collaborationSection{

    display:none;

}


.collaboration-grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(
            280px,
            1fr
        )
    );

    gap:20px;

}


/* =====================================================
   COLLABORATION CARD
===================================================== */

.collaboration-card{

    background:#ffffff;

    border:
    1px solid #e7ebf2;

    border-radius:20px;

    padding:22px;

    box-shadow:
    0 8px 30px
    rgba(
        15,
        23,
        42,
        .05
    );

    transition:
    transform .25s,
    box-shadow .25s;

    cursor:pointer;

}


.collaboration-card:hover{

    transform:
    translateY(
        -5px
    );

    box-shadow:
    0 15px 40px
    rgba(
        15,
        23,
        42,
        .10
    );

}


/* =====================================================
   COMPANY HEADER
===================================================== */

.company-header{

    display:flex;

    align-items:center;

    gap:15px;

    padding-bottom:18px;

    border-bottom:
    1px solid #eef2f7;

}


.company-logo{

    width:62px;

    height:62px;

    border-radius:14px;

    object-fit:cover;

    background:#f1f5f9;

    border:
    1px solid #e2e8f0;

}


.company-name{

    font-size:17px;

    font-weight:800;

    color:#111827;

}


.collaboration-label{

    font-size:11px;

    color:#16a34a;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.6px;

    margin-bottom:4px;

}


/* =====================================================
   EMPLOYEE
===================================================== */

.employee-section{

    display:flex;

    align-items:center;

    gap:14px;

    margin-top:18px;

}


.employee-picture{

    width:55px;

    height:55px;

    border-radius:50%;

    object-fit:cover;

    background:#f1f5f9;

    border:
    2px solid #ffffff;

    box-shadow:
    0 0 0 1px #e2e8f0;

}


.employee-details{

    flex:1;

}


.employee-id{

    font-size:13px;

    font-weight:700;

    color:#334155;

}


.employee-role{

    font-size:12px;

    color:#94a3b8;

    margin-top:3px;

}


/* =====================================================
   COLLABORATION SINCE
===================================================== */

.collaboration-date{

    margin-top:18px;

    padding-top:15px;

    border-top:
    1px solid #eef2f7;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.date-label{

    font-size:12px;

    color:#94a3b8;

}


.date-value{

    font-size:13px;

    font-weight:700;

    color:#16a34a;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:60px 20px;

    color:#64748b;

}


.spinner{

    width:38px;

    height:38px;

    border:
    4px solid #e2e8f0;

    border-top-color:#16a34a;

    border-radius:50%;

    animation:
    spin 1s linear infinite;

    margin:
    0 auto 15px;

}


@keyframes spin{

    to{

        transform:
        rotate(
            360deg
        );

    }

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    display:none;

    background:#fff1f2;

    color:#be123c;

    border:
    1px solid #fecdd3;

    padding:18px;

    border-radius:14px;

    text-align:center;

    margin-bottom:20px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    color:#94a3b8;

    font-size:12px;

    margin-top:40px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(
    max-width:700px
){

    .topbar{

        padding:
        0 16px;

    }


    .brand-text{

        font-size:15px;

    }


    .container{

        width:
        calc(
            100% - 20px
        );

        margin-top:20px;

    }


    .profile-hero{

        flex-direction:column;

        text-align:center;

        padding:25px 18px;

    }


    .profile-badges{

        justify-content:center;

    }


    .profile-name{

        font-size:23px;

    }


    .info-grid{

        grid-template-columns:
        1fr;

    }


    .info-card{

        padding:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">


    <div class="brand">

        <div class="brand-logo">

            L4

        </div>

        <div class="brand-text">

            LINK4 COMMUNICATION

        </div>

    </div>


    <a
    href="dashboard.html"
    class="back-btn"
    >

        ← Dashboard

    </a>


</header>



<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<main class="container">


    <!-- ERROR -->

    <div
    id="errorBox"
    class="error-box"
    ></div>



    <!-- LOADING -->

    <div
    id="loading"
    class="loading"
    >

        <div class="spinner"></div>

        Loading your account...

    </div>



    <!-- =================================================
         PROFILE HERO
    ================================================== -->

    <section
    id="profileHero"
    class="profile-hero"
    style="display:none;"
    >


        <img
        id="profilePicture"
        class="profile-picture"
        src=""
        alt="Profile Picture"
        >


        <div class="profile-info">


            <div
            id="profileName"
            class="profile-name"
            >

                User

            </div>


            <div
            id="profileUsername"
            class="profile-username"
            >

                @username

            </div>


            <div
            class="profile-badges"
            >


                <span
                id="profileRole"
                class="badge role-badge"
                >

                    Role

                </span>


                <span
                id="profileStatus"
                class="badge status-badge"
                >

                    Active

                </span>


            </div>


        </div>


    </section>



    <!-- =================================================
         PERSONAL INFORMATION
    ================================================== -->

    <section
    id="personalSection"
    style="display:none;"
    >


        <div class="section-title">

            <h2>
                Personal Information
            </h2>

            <span>
                Account Details
            </span>

        </div>


        <div
        id="personalInformation"
        class="info-card info-grid"
        ></div>


    </section>



    <!-- =================================================
         COLLABORATION PARTNERS
    ================================================== -->

    <section
    id="collaborationSection"
    >


        <div class="section-title">

            <h2>
                Collaboration Partners
            </h2>

            <span>
                Professional Collaboration
            </span>

        </div>


        <div
        id="collaborationGrid"
        class="collaboration-grid"
        ></div>


    </section>



    <!-- FOOTER -->

    <div class="footer">

        LINK4 COMMUNICATION

        <br>

        Professional Management System

    </div>


</main>



<script>

/* =====================================================
   API URL
===================================================== */

const API_URL =

"https://script.google.com/macros/s/AKfycbxfUUdFpRqIckbcxPuJRqUICnbjJQXhVW63P9TegivLB8ORSTFEMBkdIG8w7K2KvpBZow/exec";



/* =====================================================
   GET LOGGED USER
===================================================== */

function getUsername(){

    return (

        localStorage.getItem(
            "username"
        )

        ||

        sessionStorage.getItem(
            "username"
        )

        ||

        ""

    ).trim();

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   IMAGE URL
===================================================== */

function getImageURL(
    url
){

    if(
        !url
    ){

        return "";

    }


    return String(
        url
    ).trim();

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
    message
){

    document
    .getElementById(
        "loading"
    )
    .style.display =
    "none";


    const box =

    document
    .getElementById(
        "errorBox"
    );


    box.innerHTML =

    escapeHTML(
        message
    );


    box.style.display =
    "block";

}



/* =====================================================
   LOAD ACCOUNT
===================================================== */

async function loadAccount(){

    try{


        const username =
        getUsername();


        if(
            !username
        ){

            showError(
                "User session not found. Please login again."
            );

            return;

        }


        const url =

        API_URL +

        "?action=profile&username=" +

        encodeURIComponent(
            username
        );


        const response =

        await fetch(
            url,
            {
                method:
                "GET",

                cache:
                "no-cache"
            }
        );


        if(
            !response.ok
        ){

            throw new Error(
                "Unable to connect to server."
            );

        }


        const data =

        await response.json();


        if(
            !data.success
        ){

            throw new Error(

                data.message ||

                "Unable to load profile."

            );

        }


        renderAccount(
            data
        );


    }

    catch(error){

        console.error(
            error
        );


        showError(

            error.message ||

            "Something went wrong."

        );

    }

}



/* =====================================================
   RENDER ACCOUNT
===================================================== */

function renderAccount(
    data
){

    /* -----------------------------------------------
       HIDE LOADING
    ------------------------------------------------ */

    document
    .getElementById(
        "loading"
    )
    .style.display =
    "none";


    /* -----------------------------------------------
       SHOW HERO
    ------------------------------------------------ */

    document
    .getElementById(
        "profileHero"
    )
    .style.display =
    "flex";


    /* -----------------------------------------------
       BASIC INFORMATION
    ------------------------------------------------ */

    document
    .getElementById(
        "profileName"
    )
    .textContent =

    data.name ||

    data.profile?.Name ||

    "User";


    document
    .getElementById(
        "profileUsername"
    )
    .textContent =

    "@" +

    (
        data.username ||

        getUsername()

    );


    document
    .getElementById(
        "profileRole"
    )
    .textContent =

    data.role ||

    "User";


    document
    .getElementById(
        "profileStatus"
    )
    .textContent =

    data.status ||

    "Active";



    /* -----------------------------------------------
       PROFILE PICTURE
    ------------------------------------------------ */

    const profile =

    data.profile ||

    {};


    const profilePicture =

    profile[
        "Profile Picture"
    ]

    ||

    profile[
        "Prifile Picture"
    ]

    ||

    profile[
        "Profile picture"
    ]

    ||

    profile[
        "Prifile picture"
    ]

    ||

    "";


    const pictureElement =

    document
    .getElementById(
        "profilePicture"
    );


    if(
        profilePicture
    ){

        pictureElement.src =

        getImageURL(
            profilePicture
        );

    }

    else{

        pictureElement.src =

        "https://ui-avatars.com/api/?name=" +

        encodeURIComponent(

            data.name ||

            "User"

        ) +

        "&background=16a34a&color=fff&size=200";

    }



    /* -----------------------------------------------
       PERSONAL INFORMATION
    ------------------------------------------------ */

    renderPersonalInformation(
        profile
    );



    /* -----------------------------------------------
       COLLABORATION
    ------------------------------------------------ */

    renderCollaborations(

        data.collaborations ||

        []

    );

}



/* =====================================================
   RENDER PERSONAL INFORMATION
===================================================== */

function renderPersonalInformation(
    profile
){

    const section =

    document
    .getElementById(
        "personalSection"
    );


    const container =

    document
    .getElementById(
        "personalInformation"
    );


    container.innerHTML =
    "";


    const hiddenKeys = [

        "Profile Picture",

        "Prifile Picture",

        "Profile picture",

        "Prifile picture"

    ];


    let count = 0;


    Object
    .keys(
        profile
    )
    .forEach(

        function(key){

            if(

                hiddenKeys
                .includes(
                    key
                )

            ){

                return;

            }


            const value =

            profile[
                key
            ];


            container.innerHTML +=

            `

            <div class="info-item">

                <div class="info-label">

                    ${escapeHTML(key)}

                </div>

                <div class="info-value">

                    ${
                        value

                        ?

                        escapeHTML(
                            value
                        )

                        :

                        '<span class="empty-value">Not provided</span>'
                    }

                </div>

            </div>

            `;


            count++;

        }

    );


    if(
        count > 0
    ){

        section.style.display =
        "block";

    }

}



/* =====================================================
   RENDER UNLIMITED COLLABORATIONS
===================================================== */

function renderCollaborations(
    collaborations
){

    const section =

    document
    .getElementById(
        "collaborationSection"
    );


    const grid =

    document
    .getElementById(
        "collaborationGrid"
    );


    grid.innerHTML =
    "";


    /* -----------------------------------------------
       NO COLLABORATION
    ------------------------------------------------ */

    if(

        !Array.isArray(
            collaborations
        )

        ||

        collaborations.length === 0

    ){

        section.style.display =
        "none";

        return;

    }


    /* -----------------------------------------------
       SHOW SECTION
    ------------------------------------------------ */

    section.style.display =
    "block";


    /* -----------------------------------------------
       LOOP UNLIMITED DATA
    ------------------------------------------------ */

    collaborations.forEach(

        function(item){

            const companyName =

            item.companyName ||

            "Company";


            const companyLogo =

            item.companyLogo ||

            "https://ui-avatars.com/api/?name=" +

            encodeURIComponent(
                companyName
            ) +

            "&background=16a34a&color=fff&size=120";


            const employeePicture =

            item.employeePicture ||

            "https://ui-avatars.com/api/?name=" +

            encodeURIComponent(
                companyName
            ) +

            "&background=0f766e&color=fff&size=120";


            grid.innerHTML +=

            `

            <div class="collaboration-card">


                <div class="company-header">


                    <img

                    class="company-logo"

                    src="${escapeHTML(
                        companyLogo
                    )}"

                    alt="Company Logo"

                    onerror="this.src='https://ui-avatars.com/api/?name=Company&background=16a34a&color=fff&size=120';"

                    >


                    <div>


                        <div class="collaboration-label">

                            ${
                                escapeHTML(
                                    item.label ||
                                    "Collaboration"
                                )
                            }

                        </div>


                        <div class="company-name">

                            ${
                                escapeHTML(
                                    companyName
                                )
                            }

                        </div>


                    </div>


                </div>



                <div class="employee-section">


                    <img

                    class="employee-picture"

                    src="${escapeHTML(
                        employeePicture
                    )}"

                    alt="Employee Picture"

                    onerror="this.src='https://ui-avatars.com/api/?name=Employee&background=0f766e&color=fff&size=120';"

                    >


                    <div class="employee-details">


                        <div class="employee-id">

                            Employee ID:

                            ${
                                escapeHTML(
                                    item.employeeId ||
                                    "Not provided"
                                )
                            }

                        </div>


                        <div class="employee-role">

                            Professional Collaboration

                        </div>


                    </div>


                </div>



                <div class="collaboration-date">


                    <span class="date-label">

                        Collaboration Since

                    </span>


                    <span class="date-value">

                        ${
                            escapeHTML(
                                item.collaborationSince ||
                                "Not provided"
                            )
                        }

                    </span>


                </div>


            </div>

            `;

        }

    );

}



/* =====================================================
   PROFILE IMAGE ERROR
===================================================== */

document

.getElementById(
    "profilePicture"
)

.addEventListener(

    "error",

    function(){

        const name =

        document
        .getElementById(
            "profileName"
        )
        .textContent ||

        "User";


        this.src =

        "https://ui-avatars.com/api/?name=" +

        encodeURIComponent(
            name
        ) +

        "&background=16a34a&color=fff&size=200";

    }

);



/* =====================================================
   START
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    loadAccount

);

</script>


</body>

</html>
